services:

  db:
    image: postgres:15.6
    env_file:
      - ./backend/.env
    restart: always
    ports:
      - "5432:5432"    
    volumes:
      - postgres_data:/var/lib/postgresql/data


  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app


  backup:
    image: prodrigestivill/postgres-backup-local
    env_file:
      - ./backend/.env
    restart: always
    depends_on:
      - db
    environment:
      POSTGRES_HOST: db
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
    volumes:
      - ./backups:/backups


  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      - backend


  redis:
    image: redis:7
    ports:
      - "6379:6379"


volumes:
  postgres_data: