name: Backend tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Si empujás varios commits seguidos, cancela la corrida anterior
# en vez de acumular runs redundantes.
concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    # Variables de entorno DUMMY -- ninguna necesita ser real.
    # Los tests corren contra SQLite in-memory y mockean pg_dump/Redis,
    # así que estos valores solo existen para que app.core.config no
    # reviente al importarse (SECRET_KEY/DATABASE_URL/CORS_ORIGINS son
    # obligatorios, sin default, según vimos en el proyecto).
    env:
      SECRET_KEY: "ci-dummy-secret-key-nunca-usar-en-produccion"
      ENCRYPTION_KEY: "otra-clave-secreta-nunca-usar-en"
      DATABASE_URL: "sqlite:///./ci_dummy.db"
      CORS_ORIGINS: "http://localhost:3000"

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependencias
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Correr pytest
        working-directory: backend
        run: pytest tests/unit/ -v
